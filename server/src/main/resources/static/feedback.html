<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Re;Born 피드백</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root {
    --gray-100: #F9F9F9;
    --gray-200: #F4F4F4;
    --gray-300: #EBEBEB;
    --gray-400: #DBDBDB;
    --gray-500: #A6A6A6;
    --gray-600: #8E8E8E;
    --gray-700: #767676;
    --gray-800: #4A4A4A;
    --gray-900: #121212;
    --approve: #54B547;
    --reject: #CE2B2B;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--gray-200);
    font-family: 'Pretendard', -apple-system, sans-serif;
    color: var(--gray-900);
  }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .page {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    background: #FFFFFF;
    display: flex;
    flex-direction: column;
  }
  .header {
    padding: 40px 24px 8px;
  }
  .header .place {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
  }
  .header .subtitle {
    font-size: 16px;
    color: var(--gray-700);
    margin: 0;
    line-height: 1.5;
  }
  .content {
    flex: 1;
    padding: 16px 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .section-label {
    font-size: 16px;
    font-weight: 500;
    margin: 0 0 12px;
  }
  .device-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .device-chip {
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid var(--gray-400);
    background: var(--gray-100);
    color: var(--gray-800);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .device-chip.selected {
    background: var(--gray-800);
    border-color: var(--gray-800);
    color: var(--gray-100);
  }
  .type-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .type-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid transparent;
    background: var(--gray-100);
    font-size: 15px;
    font-weight: 500;
    color: var(--gray-900);
    cursor: pointer;
    text-align: left;
  }
  .type-chip .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .type-chip.selected {
    border-color: var(--gray-900);
    background: var(--gray-200);
  }
  textarea {
    width: 100%;
    min-height: 120px;
    resize: vertical;
    border: none;
    border-radius: 12px;
    background: var(--gray-100);
    padding: 16px;
    font-family: inherit;
    font-size: 16px;
    color: var(--gray-900);
    line-height: 1.5;
  }
  textarea::placeholder { color: var(--gray-500); }
  textarea:focus { outline: 2px solid var(--gray-800); }
  .submit-bar {
    padding: 8px 24px 40px;
  }
  button.submit {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 4px;
    background: var(--gray-900);
    color: #FFFFFF;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
  }
  button.submit:disabled {
    background: var(--gray-400);
    color: var(--gray-600);
    cursor: not-allowed;
  }
  .state-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    gap: 12px;
  }
  .state-screen .title {
    font-size: 20px;
    font-weight: 600;
  }
  .state-screen .desc {
    font-size: 15px;
    color: var(--gray-700);
    line-height: 1.6;
  }
  .hidden { display: none !important; }
  .form-state {
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  /* 데스크톱(≥860px): 좁은 화면에서만 쓰던 폭 430px 카드가 넓은 모니터에서 화면 가운데 실처럼
     떠 있어 보이던 것을, 브랜드 패널 + 폼 패널 2단 카드로 재배치한다. 마크업/JS는 그대로 두고
     grid-template-areas로 header를 왼쪽 열로만 재배치 — DOM 순서, id 참조 전부 무변경.
     주의: .header/.content/.submit-bar는 .page가 아니라 #formState(.form-state)의 자식이라
     grid는 .form-state에 걸어야 한다(.page에 걸면 조부모-손자 관계라 grid-area가 먹지 않음).
     스타일시트 맨 뒤에 둬야 위쪽의 동일 specificity 규칙(.header, .content 등)을 실제로 덮어씀. */
  @media (min-width: 860px) {
    body {
      align-items: center;
      padding: 48px 24px;
    }
    .page {
      max-width: 880px;
      min-height: 560px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 30px 80px -30px rgba(18,18,18,0.35), 0 1px 0 rgba(18,18,18,0.04);
    }
    .form-state {
      display: grid;
      grid-template-columns: minmax(280px, 340px) 1fr;
      grid-template-rows: auto 1fr auto;
      grid-template-areas:
        "header content"
        "header content"
        "header submit";
    }
    .header {
      grid-area: header;
      background: var(--gray-900);
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 40px;
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.06) 1.5px, transparent 1.5px);
      background-size: 22px 22px;
      mask-image: linear-gradient(to bottom, transparent, #000 55%, transparent);
    }
    .header .place, .header .subtitle { position: relative; }
    .header .place { color: #FFFFFF; font-size: 32px; }
    .header .subtitle { color: var(--gray-500); }
    .content {
      grid-area: content;
      padding: 44px 44px 20px;
    }
    .submit-bar {
      grid-area: submit;
      padding: 8px 44px 40px;
    }
    .type-grid {
      grid-template-columns: repeat(3, 1fr);
    }
    .state-screen {
      min-height: 520px;
    }
  }
</style>
</head>
<body>
  <div class="page">
    <!-- 로딩 -->
    <div id="loadingState" class="state-screen">
      <div class="desc">불러오는 중...</div>
    </div>

    <!-- 오류(잘못된 QR/장소 없음) -->
    <div id="errorState" class="state-screen hidden">
      <div class="title">피드백을 불러올 수 없어요</div>
      <div class="desc" id="errorMessage">QR 코드를 다시 확인해주세요.</div>
    </div>

    <!-- 제출 완료 -->
    <div id="doneState" class="state-screen hidden">
      <div class="title">소중한 의견 감사합니다!</div>
      <div class="desc">전달해주신 피드백은 관리자 확인 후 반영돼요.</div>
    </div>

    <!-- 입력 폼 -->
    <div id="formState" class="hidden form-state">
      <div class="header">
        <p class="place" id="placeName"></p>
        <p class="subtitle">지금 이 공간은 어떠신가요? 느끼신 점을 알려주세요.</p>
      </div>
      <div class="content">
        <div id="deviceSection" class="hidden">
          <p class="section-label">어떤 기기에 대한 의견인가요?</p>
          <div class="device-group" id="deviceGroup"></div>
        </div>
        <div>
          <p class="section-label">빠른 선택</p>
          <div class="type-grid" id="typeGrid"></div>
        </div>
        <div>
          <p class="section-label">자세히 알려주세요</p>
          <textarea id="content" placeholder="예) 바람이 너무 강하게 나와요"></textarea>
        </div>
      </div>
      <div class="submit-bar">
        <button class="submit" id="submitButton" disabled>피드백 보내기</button>
      </div>
    </div>
  </div>

<script>
(function () {
  var FEEDBACK_TYPES = [
    { label: '더워요', color: '#BF4040', text: '너무 더워요.' },
    { label: '추워요', color: '#40BFBF', text: '너무 추워요.' },
    { label: '바람이 강해요', color: '#406ABF', text: '바람이 너무 강해요.' },
    { label: '불이 밝아요', color: '#BFBF40', text: '불이 너무 밝아요.' },
    { label: '어두워요', color: '#808080', text: '너무 어두워요.' },
    { label: '냄새가 나요', color: '#BF8040', text: '냄새가 나요.' },
    { label: '공기가 안 좋아요', color: '#80BF40', text: '공기가 안 좋아요.' },
    { label: '시끄러워요', color: '#40BF80', text: '너무 시끄러워요.' },
    { label: '지저분해요', color: '#BF40BF', text: '주변이 지저분해요.' }
  ];

  var qs = new URLSearchParams(window.location.search);
  var qrCode = qs.get('qrCode');

  var loadingState = document.getElementById('loadingState');
  var errorState = document.getElementById('errorState');
  var errorMessage = document.getElementById('errorMessage');
  var doneState = document.getElementById('doneState');
  var formState = document.getElementById('formState');
  var placeNameEl = document.getElementById('placeName');
  var deviceSection = document.getElementById('deviceSection');
  var deviceGroup = document.getElementById('deviceGroup');
  var typeGrid = document.getElementById('typeGrid');
  var contentEl = document.getElementById('content');
  var submitButton = document.getElementById('submitButton');

  var selectedDeviceId = null;
  var selectedTypeIndex = -1;
  // 빠른 선택으로 자동 채운 텍스트를 기억해뒀다가, 사용자가 그 뒤로 직접 고치지 않았으면
  // 다른 빠른 선택을 눌렀을 때도 계속 자동으로 교체되게 한다 - 첫 선택 이후엔 !value.trim()이
  // 항상 false가 돼서 두 번째 선택부터 안 바뀌던 문제 수정
  var lastAutoFillText = '';

  function showOnly(el) {
    [loadingState, errorState, doneState, formState].forEach(function (s) {
      s.classList.toggle('hidden', s !== el);
    });
  }

  function showError(message) {
    errorMessage.textContent = message;
    showOnly(errorState);
  }

  // deviceId는 서버 DTO/스키마에서 nullable(기기 미등록 장소도 피드백 제출 가능) - 기기가
  // 하나도 없는 장소는 renderDevices()에서 selectedDeviceId가 계속 null로 남아, 여기서 기기
  // 선택을 요구하면 빠른 선택을 눌러도 버튼이 영원히 비활성 상태로 남는 문제가 있었음
  function updateSubmitState() {
    submitButton.disabled = contentEl.value.trim().length === 0;
  }

  function renderDevices(devices) {
    if (devices.length <= 1) {
      selectedDeviceId = devices.length === 1 ? devices[0].deviceId : null;
      deviceSection.classList.add('hidden');
      return;
    }
    deviceSection.classList.remove('hidden');
    devices.forEach(function (device, index) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'device-chip';
      chip.textContent = device.name;
      chip.addEventListener('click', function () {
        selectedDeviceId = device.deviceId;
        Array.prototype.forEach.call(deviceGroup.children, function (c) { c.classList.remove('selected'); });
        chip.classList.add('selected');
        updateSubmitState();
      });
      if (index === 0) {
        chip.classList.add('selected');
        selectedDeviceId = device.deviceId;
      }
      deviceGroup.appendChild(chip);
    });
  }

  function renderTypes() {
    FEEDBACK_TYPES.forEach(function (type, index) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'type-chip';
      var dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = type.color;
      var label = document.createElement('span');
      label.textContent = type.label;
      chip.appendChild(dot);
      chip.appendChild(label);
      chip.addEventListener('click', function () {
        if (selectedTypeIndex === index) {
          selectedTypeIndex = -1;
          chip.classList.remove('selected');
          return;
        }
        selectedTypeIndex = index;
        Array.prototype.forEach.call(typeGrid.children, function (c) { c.classList.remove('selected'); });
        chip.classList.add('selected');
        if (!contentEl.value.trim() || contentEl.value === lastAutoFillText) {
          contentEl.value = type.text;
          lastAutoFillText = type.text;
        }
        updateSubmitState();
      });
      typeGrid.appendChild(chip);
    });
  }

  // localStorage에 영구 저장하지 않는다(#261) - 예전엔 한 번 생성한 토큰을 영원히 재사용해서
  // 서버의 영구 유니크 체크와 합쳐져 같은 브라우저가 그 장소에 다시는 피드백을 못 보내는
  // 버그였다. 지금은 페이지 로드마다 새로 생성하는 참고용 값일 뿐, 중복 방지는 서버가
  // (장소+기기+내용) 조합으로 짧은 시간만 막는다.
  function sessionTokenFor() {
    return (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : String(Date.now()) + Math.random();
  }

  function submit() {
    submitButton.disabled = true;
    submitButton.textContent = '보내는 중...';
    fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        qrCode: qrCode,
        deviceId: selectedDeviceId,
        content: contentEl.value.trim(),
        sessionToken: sessionTokenFor()
      })
    }).then(function (res) {
      if (res.status === 429) {
        showError('이미 피드백을 제출하셨어요. 잠시 후 다시 시도해주세요.');
        return;
      }
      if (!res.ok) {
        throw new Error('submit failed');
      }
      showOnly(doneState);
    }).catch(function () {
      submitButton.disabled = false;
      submitButton.textContent = '피드백 보내기';
      window.alert('전송에 실패했어요. 다시 시도해주세요.');
    });
  }

  if (!qrCode) {
    showError('올바르지 않은 접근이에요. QR 코드를 다시 스캔해주세요.');
    return;
  }

  renderTypes();
  contentEl.addEventListener('input', updateSubmitState);
  submitButton.addEventListener('click', submit);

  fetch('/api/feedback/context?qrCode=' + encodeURIComponent(qrCode))
    .then(function (res) {
      if (res.status === 404) {
        throw new Error('not_found');
      }
      if (!res.ok) {
        throw new Error('unknown');
      }
      return res.json();
    })
    .then(function (body) {
      var data = body.data || body;
      placeNameEl.textContent = data.placeName;
      renderDevices(data.devices || []);
      updateSubmitState();
      showOnly(formState);
    })
    .catch(function (err) {
      if (err.message === 'not_found') {
        showError('존재하지 않는 장소예요. QR 코드를 다시 확인해주세요.');
      } else {
        showError('잠시 후 다시 시도해주세요.');
      }
    });
})();
</script>
</body>
</html>
