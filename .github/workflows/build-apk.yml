# dev에 푸시될 때마다 디버그 APK를 빌드해서 워크플로우 아티팩트로 올려둔다 - 배포(deploy.yml)와
# 완전히 분리된 GitHub-hosted 러너(ubuntu-latest)에서 돈다. 파이5 러너는 백엔드 Docker 빌드만으로도
# OOM이 났던 전례가 있어(Reload 리포트 참고), Android SDK+Gradle 빌드까지 얹지 않기 위해 일부러
# 자체 호스팅 러너를 쓰지 않음.
name: Build Debug APK

on:
  push:
    branches:
      - dev
  workflow_dispatch:

# 같은 브랜치에 짧은 시간 안에 여러 번 push(예: PR 여러 개 연속 머지)되면 각 push마다 별도 실행이
# 쌓여서 큐가 밀린다 - 최신 실행 하나만 의미 있으므로 같은 그룹(워크플로우+브랜치)의 이전 실행은
# 자동 취소한다(2026-08-01).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          : "${GOOGLE_SERVICES_JSON_BASE64:?GOOGLE_SERVICES_JSON_BASE64 secret is required}"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > composeApp/google-services.json
          python3 -m json.tool composeApp/google-services.json > /dev/null

      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${DEBUG_KEYSTORE_BASE64:?DEBUG_KEYSTORE_BASE64 secret is required}"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > composeApp/debug.keystore

      - name: Build debug APK
        env:
          KAKAO_APP_KEY: ${{ secrets.KAKAO_APP_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          BASE_URL: https://www.reborn-energy.com
        run: |
          chmod +x ./gradlew
          ./gradlew :composeApp:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reborn-debug-apk
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk
          if-no-files-found: error
          retention-days: 30
